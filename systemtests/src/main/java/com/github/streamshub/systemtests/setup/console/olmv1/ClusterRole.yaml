---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: console-installer-role
rules:
  # Everything from your original role...
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["console.streamshub.github.com"]
    resources: ["consoles", "consoles/status", "consoles/finalizers"]
    verbs: ["get", "list", "watch", "patch", "update", "create", "delete"]

  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: [""]
    resources: ["serviceaccounts", "services", "configmaps", "secrets",
                "namespaces", "pods", "endpoints", "nodes", "nodes/proxy"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: [""]
    resources: ["serviceaccounts/finalizers", "services/finalizers",
                "configmaps/finalizers", "secrets/finalizers",
                "namespaces/finalizers"]
    verbs: ["update"]

  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["apps"]
    resources: ["deployments/finalizers"]
    verbs: ["update"]

  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["extensions"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["kafka.strimzi.io"]
    resources: ["kafkas", "kafkanodepools", "kafkarebalances", "kafkatopics",
                "kafkausers", "kafkaconnects", "kafkamirrormaker2s"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["kafka.strimzi.io"]
    resources: ["kafkas", "kafkarebalances"]
    verbs: ["patch"]

  - apiGroups: ["monitoring.coreos.com"]
    resources: ["prometheuses/api", "servicemonitors"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get"]

  - apiGroups: ["config.openshift.io"]
    resources: ["clusterversions"]
    verbs: ["get"]

  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]

  # The critical addition — OLM v1 needs to set finalizers on ClusterExtension
  - apiGroups: ["olm.operatorframework.io"]
    resources: ["clusterextensions", "clusterextensions/finalizers"]
    verbs: ["get", "list", "watch", "update", "patch"]